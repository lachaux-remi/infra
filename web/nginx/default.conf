server_tokens off;

# Client IP as seen by Traefik
set_real_ip_from 172.19.0.0/24;
real_ip_header X-Forwarded-For;

gzip on;
gzip_vary on;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# Unknown hosts: close the connection. /healthz is used by the container healthcheck.
server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 444;
  }
}

# Per-domain server blocks live on the server only (web/data/nginx)
include /etc/nginx/private/*.conf;
