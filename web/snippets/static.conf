# Static site: include inside a server block after setting `root`
index index.html index.htm;
autoindex off;

location / {
  try_files $uri $uri/ =404;
}

location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
  expires 7d;
  add_header Cache-Control "public";
  try_files $uri =404;
}

# Hidden files (.env, .git...)
location ~ /\.(?!well-known/) {
  deny all;
}
