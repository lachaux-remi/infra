services:
  web:
    image: nginx:alpine
    container_name: web
    restart: always
    healthcheck:
      test: wget -q --spider http://127.0.0.1/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik_lan
    volumes:
      # Generic config, versioned in this repo
      - ${APPDATA:-/opt/infra}/web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APPDATA:-/opt/infra}/web/snippets:/etc/nginx/snippets:ro
      # Server-only: per-domain server blocks and content (not versioned)
      - ${APPDATA:-/opt/infra}/web/data/nginx:/etc/nginx/private:ro
      - ${APPDATA:-/opt/infra}/web/data/sites:/srv/sites:ro
      - ${APPDATA:-/opt/infra}/web/data/storage:/srv/storage:ro

networks:
  traefik_lan:
    external: true
